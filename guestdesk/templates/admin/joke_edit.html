{% extends 'base.html' %}
{% import '_macros.html' as m %}
{% from '_csrf.html' import csrf %}

{% block content %}
<h4 class="mb-3">Edit Joke</h4>
<form method="post">
  {{ csrf() }}
  <div class="mb-2">
    <label class="form-label">Setup</label>
    <textarea name="setup" class="form-control" rows="2" maxlength="300">{{ joke.setup }}</textarea>
  </div>
  <div class="mb-2">
    <label class="form-label">Punchline</label>
    <textarea name="punchline" class="form-control" rows="2" maxlength="300">{{ joke.punchline }}</textarea>
  </div>
  <div class="mb-2">
    <label class="form-label">Source / attribution (optional)</label>
    <input name="source" class="form-control" maxlength="300" value="{{ joke.source or '' }}">
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="enabled" name="enabled" value="1" {{ 'checked' if joke.enabled }}>
    <label class="form-check-label" for="enabled">Enabled (eligible to be shown in the Fun Zone)</label>
  </div>
  <button class="btn btn-primary">Save Changes</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('admin_jokes') }}">Cancel</a>
  <a class="btn btn-outline-danger" href="#" onclick="if(confirm('Delete this joke?')){ document.getElementById('del').submit(); } return false;">Delete</a>
  <form id="del" method="post" action="{{ url_for('admin_jokes_delete', jid=joke.id) }}">{{ csrf() }}</form>
</form>
{% endblock %}
