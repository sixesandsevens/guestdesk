<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ display.name }} Display</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/display_builtin.css') }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #display-root {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #slide-container {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .slide-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }
    .display-slide-image,
    .display-slide-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .display-slide-text {
      text-align: center;
      padding: 2rem;
    }
    .display-slide-text h1 { font-size: 5vw; margin-bottom: 1rem; }
    .display-slide-text h2 { font-size: 3.5vw; margin-bottom: 1rem; }
    .display-slide-text p  { font-size: 2.5vw; white-space: pre-line; }
    .fade-frame-enter {
      opacity: 0;
      animation: fadeIn ease forwards;
      animation-duration: var(--fade-duration, 1.4s);
    }
    .fade-frame-exit {
      opacity: 1;
      animation: fadeOut ease forwards;
      animation-duration: var(--fade-duration, 1.4s);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="display-root">
    {% if preview %}
    <div class="preview-badge">Preview · {{ '%.1f'|format(preview_duration or 2.5) }}s per slide</div>
    {% endif %}
    <div id="slide-container" style="--fade-duration: {{ fade_duration or 1.4 }}s;"></div>
  </div>

  <script>
    window.GUESTDESK_PLAYER = {
      url: {{ (url_for('display.slideshow_slides_api', ss_slug=slideshow_slug) if slideshow_slug else url_for('display.display_slides_api', display_slug=display_slug)) | tojson }},
      previewDuration: {{ preview_duration if preview_duration is not none else 'null' }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/display_player.js') }}"></script>
</body>
</html>
